<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.photo{
background:white;
padding:10px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
text-align:center;
}

.photo img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

.upload{
margin:20px 0;
}

.action-btn{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.action-btn button{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
}

.edit-btn{
background:#3498db;
color:white;
}

.delete-btn{
background:#e74c3c;
color:white;
}

</style>

</head>

<body>

<header>

<h1>📸 Shared Gallery</h1>

<p>Upload memories from your event</p>

</header>


<div class="container">

<div class="card">

<h2>Upload Photos</h2>

<form method="POST" enctype="multipart/form-data">

<div class="upload">
<input type="file" name="image">
</div>

<button type="submit">
Upload Images
</button>

</form>

</div>


<div class="card">

<h2>Uploaded Photos</h2>

<div class="gallery">

{% for image in images %}

<div class="photo">

<img src="{{ url_for('static', filename='uploads/' + image.filename) }}">


{% if image.name %}
<h3>{{ image.name }}</h3>
{% endif %}


<div class="action-btn">

<a href="{{ url_for('edit_image', image_id=image.id) }}">
<button class="edit-btn" type="button">
✏️ Edit Name
</button>
</a>


<a href="{{ url_for('delete_image', image_id=image.id) }}"
onclick="return confirm('Delete this image?')">

<button class="delete-btn" type="button">
🗑 Delete
</button>

</a>

</div>


</div>

{% endfor %}

</div>

</div>


<br>


<a href="/poll">

<button>
Next → Plan Event
</button>

</a>


</div>


<footer>

Hangout Hub

</footer>


</body>
</html>
