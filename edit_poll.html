<!DOCTYPE html>
<html>

<head>
<title>Edit Poll</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>
<h1>✏️ Edit Poll</h1>
</header>


<div class="container">

<div class="card">

<form method="POST">

<input type="text" name="category" value="{{ poll.category }}" required><br><br>


<input type="text" name="option1" value="{{ poll.option1 }}" required><br><br>

<input type="text" name="option2" value="{{ poll.option2 }}" required><br><br>

<input type="text" name="option3" value="{{ poll.option3 }}" required><br><br>

<input type="text" name="option4" value="{{ poll.option4 }}" required><br><br>


<button type="submit">
Save Changes
</button>

</form>

</div>

</div>

</body>
</html>
