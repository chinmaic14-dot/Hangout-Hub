<!DOCTYPE html>
<html>
<head>
    <title>Edit Image</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>Edit Image Name</h2>

<form method="POST">

    <input 
    type="text" 
    name="name" 
    value="{{ image.name }}"
    required>

    <button type="submit">
        Save Changes
    </button>

</form>

</body>
</html>
